<html>
<body>
<form>
<label>USERNAME:</label>
<input style="background-color:lavender;" type="text" placeholder="ENTER NAME" required>
<br>
<br>
<label>AGE:</label>
<input style="background-color: lightblue;" type="number">
<br>
<br>
<label>DATE OF BIRTH:</label>
<input style="background-color: violet;" type="date">
<br>
<br>
<label>PASSWORD:</label>
<input style="background-color: lightpink;" type="password">
<br>
<br>
<label>E-MAIL:</label>
<input style="background-color: lightyellow;" type="email" placeholder="ENTER E-MAIL" required>
<br>
<br>
<label>GENDER:</label>
<input style="background-color: lightsalmon;" type="radio"> Male
<input style="background-color: lightsalmon;" type="radio"> Female  
<br>
<br>
<label>SUBJECTS:</label>
<input style="background-color: lightcyan;" type="checkbox"> MATHS FOR AI

<br>

<input style="background-color: lightcoral;" type="file" value="UPLOAD">
<br>
<br>

<select>
    <option style="background-color: lightgreen;" value="INDIA">INDIA</option>
  <option style="background-color: lightgreen;" value="USA">USA</option>
  <option style="background-color: lightgreen;" value="UK">UK</option>
  <option style="background-color: lightgreen;" value="UAE">UAE</option>
  <option value="CANADA">CANADA</option>
</select>
<br>
<br>
<label>ADDRESS:</label>
<textarea style="background-color: rgb(86, 169, 217);" rows="4" cols="40"></textarea>
<br>
<br>
<input type="submit">
</br>
<input type="reset">
</form>
</body>
</html>
